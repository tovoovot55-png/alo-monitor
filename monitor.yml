name: Alo Yoga 邮件监控

on:
  schedule:
    # 每20分钟运行一次
    - cron: '*/20 * * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 生成邮箱列表 JSON
        env:
          EMAIL_LIST: ${{ secrets.EMAIL_LIST }}
        run: |
          # 把邮箱列表转成 JSON 文件，供面板读取
          python3 -c "
import os, json
lines = os.environ.get('EMAIL_LIST', '').strip().split('\\n')
emails = []
for line in lines:
    line = line.strip()
    if not line: continue
    parts = line.split('----')
    if len(parts) >= 5:
        emails.append({'email': parts[0].strip(), 'group': parts[4].strip()})
with open('email_list.json', 'w', encoding='utf-8') as f:
    json.dump(emails, f, ensure_ascii=False, indent=2)
print(f'生成了 {len(emails)} 个邮箱')
"

      - name: 运行监控脚本
        env:
          EMAIL_LIST: ${{ secrets.EMAIL_LIST }}
          BARK_URL: ${{ secrets.BARK_URL }}
        run: |
          # 如果 state.json 不存在，创建空的
          if [ ! -f state.json ]; then
            echo '{"completed": {}, "last_check": null}' > state.json
          fi
          
          # 把 state.json 内容传给脚本
          export STATE_JSON=$(cat state.json)
          
          python alo_monitor_cloud.py > output.txt
          cat output.txt
          
          # 提取新的状态 JSON 并保存
          NEW_STATE=$(grep -A 1000 "===STATE_JSON_START===" output.txt | grep -B 1000 "===STATE_JSON_END===" | grep -v "===STATE_JSON" | tr -d '\n')
          echo "$NEW_STATE" > state.json
          cat state.json

      - name: 提交更新后的文件
        run: |
          git config --local user.email "monitor-bot@users.noreply.github.com"
          git config --local user.name "monitor-bot"
          git add state.json email_list.json
          git diff --staged --quiet || git commit -m "更新监控状态 [skip ci]"
          git push
